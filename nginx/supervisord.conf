[unix_http_server]
file=/var/run/supervisor.sock   ; (the path to the socket file)
chmod=0700                       ; sockef file mode (default 0700)
username = dummy
password = dummy

[supervisord]
nodaemon=true
user=root
pidfile=/var/run/supervisord.pid ; (supervisord pidfile;default supervisord.pid)
; nodaemon=true のため supervisord のイベントログは自動的に stdout へ出る。
; ここを /dev/stdout にすると全行が二重化するので /dev/null のままにすること。
logfile=/dev/null
logfile_maxbytes=0

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock ; use a unix:// URL  for a unix socket
username = dummy
password = dummy

[program:pm2]
command=/usr/bin/pm2-runtime start /usr/local/ecosystem.config.js
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
priority=1

[program:shibd]
command=/usr/sbin/shibd -F -f -c /etc/shibboleth/shibboleth2.xml -p /tmp/shibd.pid -w 30
user=_shibd
group=_shibd
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=2

[program:php-fpm]
command=/usr/sbin/php-fpm7.4 -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[fcgi-program:fcgiwrap]
command=/usr/sbin/fcgiwrap -f
socket=unix:///usr/lib/systemd/system/fcgiwrap.socket
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
socket_mode=0777

[fcgi-program:shibauthorizer]
command=/usr/lib/x86_64-linux-gnu/shibboleth/shibauthorizer
user=_shibd
socket=unix:///tmp/shibauthorizer.sock
socket_owner=_shibd:_shibd
socket_mode=0777
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
autostart=true

[fcgi-program:shibresponder]
command=/usr/lib/x86_64-linux-gnu/shibboleth/shibresponder
user=_shibd
socket=unix:///tmp/shibresponder.sock
socket_owner=_shibd:_shibd
socket_mode=0777
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
autostart=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
autostart=true
; startretries=0 だと起動に1度失敗しただけで FATAL になり、
; nginx 不在のままコンテナが生き続ける(PM2 と同じ静かな死)。
startretries=3
