# -*- coding: utf-8 -*-
#
# ユニットテスト(CI)専用の compose オーバレイ。
#
# docker-compose2.yml に重ねて使う。やっていることは2つだけ:
#
#  1. web / worker / elasticsearch を「ビルド済みイメージの参照」に差し替える。
#     image: が指すイメージが手元にあれば docker compose はビルドしないので、
#     CI では pull したイメージがそのまま使われる。
#     モジュールは requirements-weko-modules.txt により -e (editable) で
#     入っていて、docker-compose2.yml が . を /code に bind mount するため、
#     ソースを変更してもイメージの作り直しは不要。
#
#  2. restart ポリシーを外す。CI で勝手に復帰されると失敗が見えにくい。
#
# 使い方:
#   export COMPOSE_FILE=docker-compose2.yml:docker-compose.ci.yml
#   export WEKO_IMAGE=... WEKO_ES_IMAGE=...
#   docker compose up -d postgresql elasticsearch redis rabbitmq
#   bash scripts/ci/wait-for-services.sh
#   docker compose run --rm --no-deps -T web bash -c "cd modules/weko-records && tox"
#
# ユニットテストは conftest.py が自前で wekotest DB を作り、instance_path も
# tempfile.mkdtemp() を使う。したがって install.sh がやっている
# populate-instance / デモSQL投入 / invenio assets build / invenio collect と
# nginx・pgpool・worker・inbox・mongo・flower の起動はいずれも不要。

services:
  web:
    image: ${WEKO_IMAGE:-weko-ci-web:local}
    restart: "no"

  worker:
    image: ${WEKO_IMAGE:-weko-ci-web:local}
    restart: "no"

  elasticsearch:
    image: ${WEKO_ES_IMAGE:-weko-ci-es:local}
    restart: "no"

  postgresql:
    restart: "no"

  redis:
    restart: "no"

  rabbitmq:
    restart: "no"
