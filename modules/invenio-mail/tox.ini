[tox]
envlist =
    ; py36
    ; c0
    c1
	; lint
parallel_show_output = True
skip_missing_interpreters = true

[tool:pytest]
minversion = 3.0
testpaths = tests

[coverage:run]
source =
    invenio_mail
    tests

[coverage:paths]
source =
    invenio_mail
    tests
    .tox/*/lib/python*/site-packages/invenio_mail
    .tox/*/lib/python*/site-packages/invenio_mail/tests

[flake8]
max-line-length = 119
exclude =
    .git
    __pychache__
    .tox
    venv

[isort]
profile=black

# 1テストがこの秒数を超えたら失敗させる。ハングを CI のジョブ上限
# (120分) まで走らせないための保険。pytest が tox.ini から読むのは
# [tool:pytest] ではなくこの [pytest]。
#
# セクション名は元から正しかったが、pytest-timeout が c1 の deps に無く、
# プラグインが venv に入っていないため一度も効いていなかった。実際
# weko-workflow [8/8] と weko-deposit [8/8] は毎回 120 分の上限で
# cancelled になり、何が止まっているのかログからは分からなかった。
#
# 300 から 600 に上げてある。実測の最長は1件あたり 70 秒程度なので
# 十分な余裕があり、ハングは 10 分でスタックトレース付きの失敗になる。
[pytest]
timeout = 600

[tool:isort]
line_length = 119

[mypy]
python_version = 3.6
warn_return_any = True
warn_unused_configs = True

[mypy-flask]
ignore_missing_imports = True

[testenv]
passenv = LANG
deps =
    pytest>=3
commands =
   pytest -v --basetemp="{envtmpdir}" {posargs}

[testenv:c0]
setuptools_version = 57.5.0
passenv = LANG
deps =
    pytest>=3
    pytest-cov
commands =
   pytest --cov=invenio_mail tests -v --cov-report=term --basetemp="{envtmpdir}" {posargs}

[testenv:c1]
setuptools_version = 57.5.0
passenv = LANG
deps =
    pytest>=3
    pytest-cov
    pytest-timeout
	-rrequirements2.txt
commands =
   pytest --cov=invenio_mail tests -v --cov-branch --cov-report=term --cov-report=xml --cov-report=html --basetemp="{envtmpdir}" {posargs}

[testenv:lint]
passenv = LANG
deps =
	black
	isort
	flake8
	mypy
commands =
	black .
	isort .
	flake8 .
	mypy invenio_mail


[testenv:radon]
passenv = LANG
deps = 
	radon
commands = 
	radon cc invenio_mail
	radon mi invenio_mail

