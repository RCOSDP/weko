# ユニットテスト。
#
# 【設計】本体イメージは「1回だけ」ビルドして GHCR に置き、45個のマトリクス
# ジョブはそれを pull するだけにしている。
#
#   - イメージのタグは依存関係ファイル(Dockerfile / provision / packages /
#     requirements-weko-modules / 各 setup.py など)のハッシュ。
#     モジュールのソースは requirements-weko-modules.txt で -e (editable) 
#     インストールされ、docker-compose2.yml が . を /code に bind mount する
#     ため、ソース変更でイメージを作り直す必要がない。
#     → 依存を触らない普通の PR ではビルドが 0 回になる。
#
#   - install.sh は CI では使わない。ユニットテストは conftest.py が自前で
#     wekotest DB を作り、instance_path も tempfile.mkdtemp() を使うので、
#     populate-instance / デモSQL / invenio assets build / invenio collect と
#     nginx・pgpool・worker・inbox・mongo・flower の起動はいずれも不要。
#     起動するのは PostgreSQL / Elasticsearch / Redis / RabbitMQ の4つだけ。
#
#   - tox が毎回 requirements2.txt (約290パッケージ) を入れ直す分は、
#     bind mount 済みの .ci-cache/pip を pip のキャッシュにして共有する。
#
# fork からの PR は GHCR に push できない。その場合はビルドキャッシュ
# (type=gha) だけ作り、各ジョブがそこからローカルビルドする。

name: Unit Tests

on: [push, pull_request]

jobs:
  images:
    name: Prepare images
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      web: ${{ steps.tags.outputs.web }}
      es: ${{ steps.tags.outputs.es }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # イメージのタグ = 依存関係ファイルのハッシュ。
      # ここに挙げたファイルが変わらない限り、既存イメージを再利用する。
      - name: Compute image tags
        id: tags
        env:
          WEB_HASH: ${{ hashFiles('Dockerfile', 'scripts/provision-web.sh', 'scripts/create-instance.sh', 'scripts/create-instance2.sh', 'scripts/instance.cfg', 'packages.txt', 'packages-invenio.txt', 'requirements-weko-modules.txt', 'requirements-devel.txt', 'package.json', 'modules/*/setup.py') }}
          ES_HASH: ${{ hashFiles('elasticsearch/Dockerfile', 'scripts/provision-elasticsearch.sh', 'elasticsearch/dic/character/kui.txt') }}
        run: |
          if [ -z "$WEB_HASH" ] || [ -z "$ES_HASH" ]; then
            echo "::error::イメージタグの元になるファイルが見つかりません"
            exit 1
          fi
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "web=ghcr.io/${owner}/weko-ci-web:${WEB_HASH}" >> "$GITHUB_OUTPUT"
          echo "es=ghcr.io/${owner}/weko-ci-es:${ES_HASH}" >> "$GITHUB_OUTPUT"

      # fork からの PR には GHCR への書き込み権限が渡らない。
      - name: Check push permission
        id: perm
        run: |
          if [ '${{ github.event_name }}' != 'pull_request' ] || \
             [ '${{ github.event.pull_request.head.repo.full_name }}' = '${{ github.repository }}' ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::notice::fork からの PR のため GHCR には push しません(ビルドキャッシュのみ作成)"
          fi

      - name: Log in to GHCR
        if: steps.perm.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 既にレジストリにあればビルドを丸ごと飛ばす。
      - name: Check registry for existing images
        id: exists
        run: |
          web=0; es=0
          docker manifest inspect '${{ steps.tags.outputs.web }}' >/dev/null 2>&1 && web=1
          docker manifest inspect '${{ steps.tags.outputs.es }}'  >/dev/null 2>&1 && es=1
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "es=$es"   >> "$GITHUB_OUTPUT"
          if [ "$web" = 1 ]; then
            echo "::notice::既存イメージを再利用します(本体ビルドなし)"
          else
            echo "::notice::依存関係が変わったため本体イメージをビルドします"
          fi
          exit 0

      - name: Set up Docker Buildx
        if: steps.exists.outputs.web == '0' || steps.exists.outputs.es == '0'
        uses: docker/setup-buildx-action@v3

      - name: Build WEKO image
        if: steps.exists.outputs.web == '0'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.tags.outputs.web }}
          push: ${{ steps.perm.outputs.push == 'true' }}
          cache-from: type=gha,scope=weko-web
          cache-to: type=gha,mode=max,scope=weko-web

      - name: Build Elasticsearch image
        if: steps.exists.outputs.es == '0'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: elasticsearch/Dockerfile
          tags: ${{ steps.tags.outputs.es }}
          push: ${{ steps.perm.outputs.push == 'true' }}
          cache-from: type=gha,scope=weko-es
          cache-to: type=gha,mode=max,scope=weko-es

  test:
    name: ${{ matrix.module }}
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_FILE: docker-compose2.yml:docker-compose.ci.yml
      WEKO_IMAGE: ${{ needs.images.outputs.web }}
      WEKO_ES_IMAGE: ${{ needs.images.outputs.es }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        module:
          - invenio-accounts
          - invenio-communities
          - invenio-db
          - invenio-deposit
          - invenio-files-rest
          - invenio-iiif
          - invenio-indexer
          - invenio-mail
          - invenio-oaiharvester
          - invenio-oaiserver
          - invenio-oauth2server
          - invenio-previewer
          - invenio-queues
          - invenio-records-rest
          - invenio-records
          - invenio-resourcesyncclient
          - invenio-resourcesyncserver
          - invenio-s3
          - invenio-stats
          - weko-accounts
          - weko-admin
          - weko-authors
          - weko-bulkupdate
          - weko-deposit
          - weko-gridlayout
          - weko-groups
          - weko-handle
          - weko-index-tree
          - weko-indextree-journal
          - weko-items-autofill
          - weko-items-ui
          - weko-itemtypes-ui
          - weko-logging
          - weko-plugins
          - weko-records-ui
          - weko-records
          - weko-redis
          - weko-schema-ui
          - weko-search-ui
          - weko-sitemap
          - weko-swordserver
          - weko-theme
          - weko-user-profiles
          - weko-workflow

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # テストはコンテナ内で動くので、ランナー側の Python は不要。
    # フォントは描画系のテストが参照する。
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji

    - name: Log in to GHCR
      continue-on-error: true
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Pull prebuilt images
      id: pull
      continue-on-error: true
      run: |
        docker pull -q "$WEKO_IMAGE"
        docker pull -q "$WEKO_ES_IMAGE"

    # fork PR など pull できない場合のみ、ビルドキャッシュからローカルビルドする。
    - name: Set up Docker Buildx
      if: steps.pull.outcome == 'failure'
      uses: docker/setup-buildx-action@v3

    - name: Build WEKO image (fallback)
      if: steps.pull.outcome == 'failure'
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        tags: ${{ env.WEKO_IMAGE }}
        load: true
        cache-from: type=gha,scope=weko-web

    - name: Build Elasticsearch image (fallback)
      if: steps.pull.outcome == 'failure'
      uses: docker/build-push-action@v6
      with:
        context: .
        file: elasticsearch/Dockerfile
        tags: ${{ env.WEKO_ES_IMAGE }}
        load: true
        cache-from: type=gha,scope=weko-es

    # tox が張る venv への pip インストールを、ダウンロードなしで済ませる。
    # .ci-cache は bind mount 経由でコンテナから /code/.ci-cache として見える。
    - name: Restore pip cache
      uses: actions/cache/restore@v4
      with:
        path: .ci-cache/pip
        key: weko-pip-${{ hashFiles('modules/*/requirements2.txt') }}
        restore-keys: |
          weko-pip-

    - name: Prepare workspace permissions
      # コンテナは uid 1000 (invenio) で動く。bind mount 先を書けるようにする。
      run: |
        mkdir -p .ci-cache/pip
        sudo chown -R 1000:1000 ./modules .ci-cache

    # ユニットテストが使うのはこの4つだけ。
    # nginx・pgpool・worker・inbox・mongo・flower は起動しない。
    - name: Start test services
      run: docker compose up -d --quiet-pull postgresql elasticsearch redis rabbitmq

    - name: Wait for services to be ready
      run: bash scripts/ci/wait-for-services.sh

    - name: Run tox in ${{ matrix.module }}
      run: |
        docker compose run --rm --no-deps -T \
          web bash /code/scripts/ci/run-module-tests.sh '${{ matrix.module }}'

    - name: Show logs if failed
      if: failure()
      run: docker compose logs --tail=200

    # 45ジョブが同じキーで保存を試みるが、先着1つだけが保存され残りは
    # 予約に失敗してスキップされる(警告のみ)。モジュール間で
    # requirements2.txt はほぼ同一なので、1つ保存されれば全体に効く。
    - name: Save pip cache
      if: always()
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: .ci-cache/pip
        key: weko-pip-${{ hashFiles('modules/*/requirements2.txt') }}

    - name: Stop containers
      if: always()
      run: docker compose down -v
