
# --- Crossref DOI registration, screenshot capture environment -------------
# Appended to the rendered invenio.cfg by compose.e2e.yml.  In a real
# deployment these lines belong in scripts/instance.cfg with the credentials
# your repository was issued by Crossref.

# Off by default in weko_workflow/config.py; nothing is deposited until this
# is true.
WEKO_CROSSREF_ALLOW_REGISTER_DOI = True

# Production is https://doi.crossref.org/servlet/..., Crossref's test system
# is https://test.crossref.org/servlet/...  Here both point at the local stub
# so the capture does not depend on credentials or on Crossref being up.
WEKO_CROSSREF_DEPOSIT_URL = 'http://crossref-stub:8000/servlet/deposit'
WEKO_CROSSREF_SUBMISSION_LOG_URL = \
    'http://crossref-stub:8000/servlet/submissionDownload'

# The stub accepts anything; a real deployment uses the Crossref account.
WEKO_CROSSREF_LOGIN_ID = 'weko-stub'
WEKO_CROSSREF_LOGIN_PASSWD = 'weko-stub-password'

# Written into the <head> of every doi_batch document.
WEKO_CROSSREF_DEPOSITOR_NAME = 'WEKO3 Repository'
WEKO_CROSSREF_DEPOSITOR_EMAIL = 'wekosoftware@nii.ac.jp'
WEKO_CROSSREF_REGISTRANT = 'National Institute of Informatics'

# Deposit and poll fast enough to watch the state machine run.  The defaults
# (10s / 60s / 300s) are right for production and too slow for a capture.
WEKO_DOI_SUBMIT_COUNTDOWN = 1
WEKO_DOI_FIRST_POLL_DELAY = 5
WEKO_DOI_POLL_INTERVAL = 5

# 'posted_content' (the default) deposits every item as posted_content, which
# keeps the mapping small; 'auto' follows the resource type, so a journal
# article with a source title is deposited as a Crossref journal_article.
WEKO_CROSSREF_RECORD_TYPE_POLICY = 'auto'
